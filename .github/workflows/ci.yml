name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
  env:
    PYTHONPATH: .
    MPLBACKEND: Agg
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    # CPU-only wheel: the default PyPI torch wheel pulls in several GB of CUDA deps.
    - name: Install CPU-only PyTorch
      run: pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run unit tests
      run: python -m unittest discover -s tests -v

    - name: Verify application imports and routes
      run: python -c "from backend.app import app; print('routes:', len(app.routes))"

    - name: Compile all sources
      run: python -m compileall -q backend run.py
